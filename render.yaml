services:
  - type: web
    name: blindspot-gateway
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @blindspot/gateway start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: BLINDSPOT_DEFAULT_MODEL
        value: anthropic:claude-sonnet-4-6
      - key: BLINDSPOT_EVAL_MODE
        value: inline
      - key: JUDGE_MODEL
        value: anthropic:claude-haiku-4-5-20251001
      - key: GOLDEN_MODEL
        value: anthropic:claude-haiku-4-5-20251001

  - type: web
    name: blindspot-dashboard
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @blindspot/dashboard build
    startCommand: pnpm --filter @blindspot/dashboard start
    envVars:
      - key: BLINDSPOT_GATEWAY_URL
        value: https://blindspot-gateway.onrender.com
